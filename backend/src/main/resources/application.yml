spring:
  application:
    name: study-pm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studypm}
    username: ${DB_USERNAME:studypm}
    password: ${DB_PASSWORD:studypm}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:study-pm-development-secret-key-please-change-in-production}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      http-only: true
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: Lax
      max-age: 14d
  ai:
    enabled: ${AI_ENABLED:false}
    retention-days: ${AI_RETENTION_DAYS:30}
    job-timeout: ${AI_JOB_TIMEOUT:5m}
    daily-generation-limit: ${AI_DAILY_GENERATION_LIMIT:10}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      prompt-version: v1
      schema-version: v1
      strategy-version: v1
    vision:
      api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
