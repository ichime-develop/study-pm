spring:
  application:
    name: study-pm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studypm}
    username: ${DB_USERNAME:studypm}
    password: ${DB_PASSWORD:studypm}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:.env.local[.properties],optional:file:../.env.local[.properties]
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:study-pm-development-secret-key-please-change-in-production}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      http-only: true
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: Lax
      max-age: 14d
  ai:
    enabled: ${AI_ENABLED:false}
    retention-days: ${AI_RETENTION_DAYS:30}
    job-timeout: ${AI_JOB_TIMEOUT:5m}
    daily-generation-limit: ${AI_DAILY_GENERATION_LIMIT:10}
    worker:
      enabled: ${AI_WORKER_ENABLED:true}
      poll-interval: ${AI_WORKER_POLL_INTERVAL:2s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      request-timeout: ${OPENAI_REQUEST_TIMEOUT:120s}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:24000}
      communication-retries: ${OPENAI_COMMUNICATION_RETRIES:2}
      retry-backoff: ${OPENAI_RETRY_BACKOFF:1s}
      prompt-version: v7
      schema-version: v4
      strategy-version: v3
    vision:
      api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
      endpoint: ${GOOGLE_CLOUD_VISION_ENDPOINT:vision.googleapis.com:443}
      request-timeout: ${GOOGLE_CLOUD_VISION_REQUEST_TIMEOUT:60s}
      communication-retries: ${GOOGLE_CLOUD_VISION_COMMUNICATION_RETRIES:1}
      retry-backoff: ${GOOGLE_CLOUD_VISION_RETRY_BACKOFF:500ms}
