spring:
  application:
    name: study-pm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studypm}
    username: ${DB_USERNAME:studypm}
    password: ${DB_PASSWORD:studypm}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:study-pm-development-secret-key-please-change-in-production}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      http-only: true
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: Lax
      max-age: 14d
